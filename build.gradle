plugins {
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.24' apply false
    id 'org.spongepowered.mixin' version '0.7.38' apply false
}

ext {
    modId = 'better_dimension_fonts'
    modName = 'Better Dimension Fonts'
    modGroupId = 'com.bettercontent'
    modDescription = 'Neutral-charge dimensional fonts open real-dimension expeditions from small altars.'
}

// Every invocation gets its own generated fixture; failed worlds are never reset by a later run.
ext.gameTestRunId = UUID.randomUUID().toString()
ext.gameTestRunDirectory = layout.buildDirectory.dir("gametest/${gameTestRunId}").get().asFile
apply from: rootProject.file('gradle/forge-module.gradle')

// CI and fresh-release builds provide verified runtime JARs explicitly. Ordinary local builds
// retain the canonical sibling build/libs convention.
def betterContentJar = { String repository, String artifact ->
    def directory = providers.environmentVariable('BC_CUSTOM_MOD_JAR_DIR').orNull
    if (directory != null && directory.isBlank()) {
        throw new GradleException('BC_CUSTOM_MOD_JAR_DIR must not be blank')
    }
    def jar = directory == null
        ? file("../${repository}/build/libs/${artifact}")
        : file(directory).toPath().resolve(artifact).toFile()
    if (!jar.isFile()) {
        throw new GradleException("Missing Better Content provider ${artifact} at ${jar}; prepare BC_CUSTOM_MOD_JAR_DIR or build ${repository} first")
    }
    jar
}

repositories {
    maven { url = 'https://maven.llamalad7.mixinextras.org/releases/' }
    ivy {
        name = 'betterContentFixesLocal'
        url = uri(betterContentJar('better-compat-fixes', 'better-compat-fixes-0.1.9.jar').parentFile)
        patternLayout { artifact('[artifact]-[revision].[ext]') }
        metadataSources { artifact() }
        content { includeGroup('bettercontent.local') }
    }
}

def dimensionDrinkGameTestNamespaces = (findProperty('dimensionDrinkGameTestNamespaces') ?: modId).toString()
def explicitGameTestSelection = findProperty('dimensionDrinkGameTestSelection')?.toString()?.toLowerCase(Locale.ROOT)
ext.dimensionDrinkGameTestSelection = explicitGameTestSelection ?: 'all'
def supportedSelections = ['all', 'smoke', 'run', 'activation', 'rewards', 'void', 'data', 'template', 'multiplayer', 'commands', 'runtime']
if (!supportedSelections.contains(dimensionDrinkGameTestSelection)) {
    throw new GradleException("Unknown Better Dimension Fonts GameTest selection: ${dimensionDrinkGameTestSelection}")
}

gradle.projectsEvaluated {
    minecraft.runs.configureEach {
        property 'forge.enabledGameTestNamespaces', dimensionDrinkGameTestNamespaces
    }
}

dependencies {
    def mantleDep = 'curse.maven:mantle-74924:7563777'
    def tconstructDep = 'curse.maven:tinkers-construct-74072:7449219'

    compileOnly fg.deobf(mantleDep)
    compileOnly fg.deobf(tconstructDep)
    compileOnly fg.deobf('bettercontent.local:better-compat-fixes:0.1.9')
    // Forge dev runs load declared mandatory dependencies from runtimeOnly; testRuntimeOnly
    // alone is not part of the GameTestServer launch classpath.
    runtimeOnly fg.deobf('bettercontent.local:better-compat-fixes:0.1.9')
    runtimeOnly files(betterContentJar('better-gameplay-notices', 'better-gameplay-notices-1.0.0.jar'))
    // Better Content Fixes uses MixinExtras at runtime. The provider's reobfuscated
    // development JAR does not expose that nested dependency to ForgeGradle runs.
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.4'
    testCompileOnly fg.deobf('bettercontent.local:better-compat-fixes:0.1.9')
    testRuntimeOnly fg.deobf('bettercontent.local:better-compat-fixes:0.1.9')
    if ((findProperty('dimensionDrinkIncludeCompatRuntime') ?: 'false').toString().toBoolean()) {
        runtimeOnly fg.deobf(mantleDep)
        runtimeOnly fg.deobf(tconstructDep)
    }
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn(tasks.named('check'))
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs deterministic checks and every production headless Forge GameTest.'
    dependsOn(tasks.named('verifyFast'))
    dependsOn(tasks.named('headlessGameTest'))
}

tasks.register('verifySmoke') {
    group = 'verification'
    description = 'Runs deterministic checks and the explicit lifecycle smoke GameTest profile.'
    dependsOn(tasks.named('verifyFast'))
    dependsOn(tasks.named('headlessGameTest'))
}

gradle.taskGraph.whenReady { graph ->
    boolean full = graph.hasTask(tasks.named('verifyFull').get())
    boolean smoke = graph.hasTask(tasks.named('verifySmoke').get())
    if (full && smoke) throw new GradleException('Run verifyFull and verifySmoke in separate invocations')
    String required = full ? 'all' : smoke ? 'smoke' : null
    if (required != null && explicitGameTestSelection != null && explicitGameTestSelection != required) {
        throw new GradleException("${full ? 'verifyFull' : 'verifySmoke'} requires GameTest selection ${required}")
    }
    if (required != null) project.ext.dimensionDrinkGameTestSelection = required
    if ((full || smoke) && dimensionDrinkGameTestNamespaces != modId) {
        throw new GradleException('Verification requires the better_dimension_fonts GameTest namespace')
    }
}

apply from: rootProject.file('gradle/gametest-evidence.gradle')

// Non-shipping real-client screenshot harness. Its dimension dependencies stay out of
// production and the regular GameTest runtime.
sourceSets {
    visualHarness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.visualHarnessImplementation.extendsFrom configurations.implementation
configurations.visualHarnessRuntimeOnly.extendsFrom configurations.runtimeOnly
def bumblezoneVisualDevelopment = configurations.create('bumblezoneVisualDevelopment')
def remapVisualBumblezone = tasks.register('remapVisualBumblezone', Exec) {
    dependsOn tasks.named('createSrgToMcp')
    def output = layout.buildDirectory.file('visual/dependencies/bumblezone-mapped.jar')
    inputs.files(bumblezoneVisualDevelopment)
    inputs.file('scripts/remap-visual-bumblezone-mixins.py')
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    outputs.file(output)
    doFirst {
        commandLine 'python3', 'scripts/remap-visual-bumblezone-mixins.py',
            bumblezoneVisualDevelopment.singleFile.absolutePath,
            layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath,
            output.get().asFile.absolutePath
    }
}

dependencies {
    visualHarnessRuntimeOnly fg.deobf('curse.maven:aether-255308:6134920')
    visualHarnessRuntimeOnly fg.deobf('curse.maven:curios-api-309927:6418456')
    add('bumblezoneVisualDevelopment', fg.deobf('curse.maven:the-bumblezone-362479:8548194'))
    visualHarnessRuntimeOnly files(layout.buildDirectory.file('visual/dependencies/bumblezone-mapped.jar')).builtBy(remapVisualBumblezone)
    visualHarnessRuntimeOnly fg.deobf('curse.maven:rats-323596:5904296')
    visualHarnessRuntimeOnly fg.deobf('curse.maven:citadel-331936:7476570')
}

minecraft.runs {
    visualServer {
        parent minecraft.runs.server
        workingDirectory project.file('build/visual/server')
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        args '--nogui'
        mods { better_dimension_fonts_visual_harness { source sourceSets.visualHarness } }
    }
    visualClient {
        parent minecraft.runs.client
        workingDirectory project.file('build/visual/client')
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        args '--quickPlayMultiplayer', '127.0.0.1:25566', '--width', '1600', '--height', '900'
        mods { better_dimension_fonts_visual_harness { source sourceSets.visualHarness } }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runVisualServer') standardInput = System.in
}
tasks.matching { it.name in ['prepareRunVisualServerCompile', 'prepareRunVisualClientCompile'] }
    .configureEach { dependsOn remapVisualBumblezone }
